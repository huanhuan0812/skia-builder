name: Build Skia

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-26

    steps:
      - name: Checkout skia
        run: |
          set -e
          git clone --depth 1 https://skia.googlesource.com/skia.git
          cd skia
          python3 tools/git-sync-deps

      - name: Install system libraries and tools
        run: |
          set -e
          brew update
          brew install ninja pkg-config \
            libpng webp jpeg-turbo freetype harfbuzz icu4c zlib expat

      - name: Setup pkg-config path
        run: |
          PC=/opt/homebrew/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/libpng/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/webp/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/jpeg-turbo/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/freetype/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/harfbuzz/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/icu4c/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/zlib/lib/pkgconfig
          PC=$PC:/opt/homebrew/opt/expat/lib/pkgconfig
          echo "PKG_CONFIG_PATH=$PC" >> $GITHUB_ENV

      - name: Verify pkg-config finds libs
        run: |
          set -e
          pkg-config --modversion libpng
          pkg-config --modversion libwebp
          pkg-config --modversion libjpeg
          pkg-config --modversion freetype2
          pkg-config --modversion harfbuzz
          pkg-config --modversion icu-uc
          pkg-config --modversion zlib
          pkg-config --modversion expat

      - name: Inspect skia deps and gn args
        run: |
          cd skia
          echo "=== externals ==="
          ls third_party/externals/ | head -50
          echo "=== gn args list (filtered) ==="
          bin/gn args out/Release --list 2>/dev/null \
            | grep -i -E "webp|png|jpeg|zlib|freetype|harfbuzz|icu|system|use_" \
            | head -100 || echo "no match"

      - name: Generate build files
        run: |
          set -e
          cd skia
          bin/gn gen out/Release --args='is_official_build=true skia_use_gl=true skia_use_metal=true skia_use_icu=true extra_cflags=["-I/opt/homebrew/include","-I/opt/homebrew/opt/libpng/include","-I/opt/homebrew/opt/webp/include","-I/opt/homebrew/opt/jpeg-turbo/include","-I/opt/homebrew/opt/freetype/include/freetype2","-I/opt/homebrew/opt/harfbuzz/include","-I/opt/homebrew/opt/icu4c/include","-I/opt/homebrew/opt/zlib/include","-I/opt/homebrew/opt/expat/include"] extra_ldflags=["-L/opt/homebrew/lib","-L/opt/homebrew/opt/libpng/lib","-L/opt/homebrew/opt/webp/lib","-L/opt/homebrew/opt/jpeg-turbo/lib","-L/opt/homebrew/opt/freetype/lib","-L/opt/homebrew/opt/harfbuzz/lib","-L/opt/homebrew/opt/icu4c/lib","-L/opt/homebrew/opt/zlib/lib","-L/opt/homebrew/opt/expat/lib"]'
      - name: Build skia
        run: |
          set -e
          cd skia
          ninja -C out/Release skia

      - name: Package
        run: |
          set -e
          cd skia
          mkdir -p dist/include dist/lib
          cp -R include/* dist/include/
          cp out/Release/libskia.a dist/lib/
          tar czf skia-macos-arm64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-macos-arm64
          path: skia/skia-macos-arm64.tar.gz
          if-no-files-found: error
