name: Build Skia

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-26

    steps:
      - name: Checkout skia
        run: |
          set -e
          git clone --depth 1 https://skia.googlesource.com/skia.git
          cd skia
          python3 tools/git-sync-deps

      - name: Verify externals
        run: |
          cd skia
          ls third_party/externals/
          for d in libpng libwebp libjpeg-turbo zlib freetype harfbuzz icu expat; do
            if [ -d "third_party/externals/$d" ]; then
              echo "OK: $d"
            else
              echo "MISSING: $d"
            fi
          done

      - name: Install ninja
        run: brew install ninja

      - name: Generate build files
        run: |
          set -e
          cd skia
          bin/gn gen out/Release --args='is_official_build=true skia_use_gl=true skia_use_metal=true skia_use_icu=true skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_libjpeg_turbo=false skia_use_system_harfbuzz=false skia_use_system_zlib=false skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_icu=false'

      - name: Build skia
        run: |
          set -e
          cd skia
          ninja -C out/Release skia

      - name: Package
        run: |
          set -e
          cd skia
          mkdir -p dist/include dist/lib
          cp -R include/* dist/include/
          cp out/Release/libskia.a dist/lib/
          {
            echo "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
            echo "Skia commit: $(git rev-parse HEAD)"
            echo "GN args: is_official_build=true with skia_use_system_*=false (bundled externals)"
            echo "Target: arm64-apple-macos11"
          } > dist/BUILD_INFO.txt
          tar czf skia-macos-arm64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-macos-arm64
          path: skia/skia-macos-arm64.tar.gz
          if-no-files-found: error
